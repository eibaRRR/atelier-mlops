stages:
  prepare:
    cmd: python src/prepare_data.py
    deps:
      - src/prepare_data.py
    outs:
      - data/raw/iris.csv
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/raw/iris.csv
    params:
      - train.n_estimators
      - train.max_depth
      - train.random_state
      - train.test_size
      - knn.n_neighbors
      - knn.weights
    outs:
      - models/model.pkl
      - models/knn_model.pkl
    metrics:
      - reports/metrics.json:
          cache: false
      - reports/knn_metrics.json:
          cache: false
